name: Warm match cache

# Precomputes match rankings so readers never wait for one.
#
# Runs the warmer HERE rather than calling a Vercel route, and that is a deliberate move.
# Measured against hosted data, one re-rank took 238 seconds — and the same call took 118s
# earlier, so the variance is wider than any budget worth setting. Vercel caps a function at
# 300s, which leaves no margin: one slow response and the function dies mid-call, the free-tier
# quota is spent and nothing is cached. This job has hours.
#
# SEPARATE FROM keep-alive.yml, which runs every 3 days — right for stopping Supabase pausing,
# far too slow for matching, where a job posted Monday would have no candidates until Thursday.
on:
  schedule:
    - cron: '23 * * * *' # hourly, off the hour so it does not pile up with everyone else's jobs
  workflow_dispatch:
    inputs:
      budget_seconds:
        description: How long to keep starting new subjects
        required: false
        default: '1500'

# One run at a time. Two concurrent warms would race the same cold subjects, spend double the
# quota and cache one result.
concurrency:
  group: warm-matches
  cancel-in-progress: false

jobs:
  warm:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Embeddings first: a subject with no vector cannot be warmed, and ingest-on-write is
      # in-process — on Vercel a function can be frozen once the response is sent, so a queued
      # embed may never finish. This is the safety net for exactly that, and it is idempotent:
      # only rows never embedded, or edited since, are touched.
      - name: Backfill missing embeddings
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run embed:backfill

      - name: Warm the match cache
        env:
          # The hosted pooler connection. Nothing here touches the deployed app.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WARM_BUDGET_MS: ${{ github.event.inputs.budget_seconds && format('{0}000', github.event.inputs.budget_seconds) || '1500000' }}
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::DATABASE_URL and GEMINI_API_KEY must both be set under Settings → Secrets and variables → Actions."
            exit 1
          fi
          npm run match:warm
